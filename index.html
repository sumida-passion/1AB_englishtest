width="2"/><ellipse cx="22" cy="16" rx="3" ry="11" fill="#efb8bb"/><ellipse cx="39" cy="16" rx="3" ry="11" fill="#efb8bb"/><ellipse cx="29" cy="52" rx="24" ry="18" fill="white" stroke="#52695f" stroke-width="2"/><circle cx="31" cy="35" r="19" fill="white" stroke="#52695f" stroke-width="2"/><circle cx="24" cy="34" r="2.5"/><circle cx="38" cy="34" r="2.5"/><path d="M28 40 Q31 44 34 40" fill="none" stroke="#c77b80" stroke-width="2"/></svg><span class="goal">🏁</span></div><div class="bar"><div id="bar" style="width:0%"></div></div><section id="home"><h2>一路答对，冲向终点！</h2><p>答错一道题就从头开始。不断挑战，争取全部答对！</p><button onclick="start('g')">语法达人　16题</button><button onclick="start('t')">翻译达人　28题</button><button onclick="identify()">👹 魔鬼44题 · 完全通关</button><p class="muted" id="records"></p><button class="secondary" onclick="chooseLanguage()">返回语言选择 / 言語選択</button></section><section id="identity" hidden><h2>👹 挑战魔鬼44题</h2><p>连续答对44题，完成挑战！</p><form id="entry"><label for="classno">班级学号（クラス番号，无需填写姓名）</label><input id="classno" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" required placeholder="20312" autocomplete="off"><p class="muted">例如：2年级3班12号 → 20312<br>从开始到最后一道题答对为止计时。答错重来时计时不会停止。</p><button type="submit">START　开始魔鬼挑战</button></form><button class="secondary" onclick="home()">返回</button></section><section id="game" hidden><div class="meta" id="timing" hidden><span id="player"></span><span id="timer">TIME 00:00</span></div><div class="meta"><span id="count"></span><span id="best"></span></div><p id="q"></p><div id="opts"></div><div id="feedback" class="feedback" hidden aria-live="polite"></div><button id="next" hidden></button><button class="secondary" onclick="home()">返回模式选择</button></section><section id="win" hidden><h2>🏆 到达终点！全部答对！</h2><p id="wintext"></p><div id="certificate" hidden><small>ENGLISH RABBIT · ACHIEVEMENT CERTIFICATE</small><div style="font-size:46px">🏆</div><h2>鬼44問 完全制覇<br>认定证书（認定証）</h2><p>班级学号（クラス番号）</p><div class="number" id="certno"></div><p>已连续答对全部44题。<br>全44 const data=[{"id": 113, "q": "We went to the park to play soccer.【日本語訳】", "a": "私たちはサッカーをするために公園へ行きました。", "e": "不定詞：副詞的用法（目的）。", "w": ["私たちは公園でサッカーを見ました。", "私たちはサッカーをした後、公園へ行きました。", "私たちは公園へ行くためにサッカーをしました。"]}, {"id": 4, "q": "Translate In Japan and In Japanese into Japanese.", "a": "in Japan：日本で・日本に in Japanese：日本語で", "e": "", "w": ["in Japan：日本語で / in Japanese：日本で", "in Japan：日本人 / in Japanese：日本へ", "in Japan：日本から / in Japanese：日本の"]}, {"id": 11, "q": "When be verbs and past participles appear together in a sentence or clause, why are they treated as one unit? Explain in Japanese.", "a": "be動詞＋過去分詞で受動態（～される）を作るため、まとまった述語として捉える。 ※状態・形容詞用法の例外あり。", "e": "", "w": ["必ず進行形を作るため", "必ず未来形を作るため", "過去分詞が主語になるため"]}, {"id": 124, "q": "I think that she is kind.【日本語訳】", "a": "私は彼女が親切だと思います。", "e": "that＋主語＋動詞（名詞節）。", "w": ["彼女は私が親切だと思います。", "私は彼女が親切ではないと思います。", "私は彼女に親切にしました。"]}, {"id": 15, "q": "Write two Japanese meanings of When + S + V.", "a": "①～するとき ②いつSがVするか", "e": "", "w": ["～以来・～なので", "～のために・～にとって", "～すること・～するための"]}, {"id": 118, "q": "We stayed in Kyoto for three days.【日本語訳】", "a": "私たちは3日間京都に滞在しました。", "e": "for：～の間（期間）。", "w": ["私たちは3日前に京都を出ました。", "私たちは京都に3日後に行きます。", "私たちは京都に3年間滞在しました。"]}, {"id": 112, "q": "She has many books to read.【日本語訳】", "a": "彼女には読むための本がたくさんあります。", "e": "不定詞：形容詞的用法（booksを修飾）。", "w": ["彼女はたくさんの本を読みました。", "彼女は本をたくさん買いたいです。", "彼女には読む本がありません。"]}, {"id": 5, "q": "When you find that in a sentence, what do you usually expect to come next?Write your answer in Japanese.", "a": "主語＋動詞を伴う節が続くことが多い（接続詞thatの場合）。 ※指示代名詞などのthatは別。", "e": "", "w": ["必ず動詞の原形が続く", "必ず名詞だけが続く", "必ず過去分詞が続く"]}, {"id": 135, "q": "The book that I bought yesterday is interesting.【日本語訳】", "a": "私が昨日買った本は面白いです。", "e": "関係代名詞that：後ろに節。接続詞thatとは異なる応用。", "w": ["昨日私が読んだ本は面白いです。", "私が昨日買った本は面白くありません。", "私が今日買った本は面白いです。"]}, {"id": 127, "q": "He is studying English now.【日本語訳】", "a": "彼は今、英語を勉強しています。", "e": "be動詞＋現在分詞：進行形。", "w": ["彼は毎日英語を教えています。", "彼は昨日英語を勉強しました。", "彼は今英語を勉強していません。"]}, {"id": 130, "q": "Please write your name in Japanese.【日本語訳】", "a": "名前を日本語で書いてください。", "e": "in Japanese：日本語で。", "w": ["名前を日本で書いてください。", "日本語で話してください。", "名前を英語で書いてください。"]}, {"id": 13, "q": "Explain in Japanese the meanings of word, phrase, clause, and sentence.", "a": "語：意味や文法上の働きを持つ語 句：主語＋動詞を備えない語のまとまり 節：主語＋動詞を備えた語のまとまり 文：原則として独立した意味内容を表すまとまり。", "e": "", "w": ["語：文全体／句：主語と動詞を持つ／節：単語一つ／文：名詞のみ", "語：単語／句：必ず主語と動詞を持つ／節：主語と動詞を持たない／文：独立したまとまり", "語・句・節・文はすべて同じ意味"]}, {"id": 115, "q": "This is a good place to study.【日本語訳】", "a": "ここは勉強するためには良い場所です（＝ここは勉強するのによい場所です）。", "e": "不定詞：形容詞的用法。自然な日本語では「勉強するのに」とも訳す。", "w": ["ここは勉強した人のための場所です。", "ここで勉強するのは難しいです。", "ここは遊ぶのによい場所です。"]}, {"id": 121, "q": "Since it was raining, we stayed home.【日本語訳】", "a": "雨が降っていたので、私たちは家にいました。", "e": "since：～なので（理由）。", "w": ["雨が降っていたとき、私たちは外出しました。", "私たちは家にいたので雨が降りました。", "雨が降っていなかったので家にいました。"]}, {"id": 134, "q": "It is difficult for me to answer this question.【日本語訳】", "a": "この質問に答えることは私にとって難しいです。", "e": "形式主語It／for me／不定詞（真主語）。", "w": ["私にとって質問することは難しいです。", "彼にとってこの質問に答えることは難しいです。", "私にとってこの質問に答えることは簡単です。"]}, {"id": 1, "q": "There are two kinds of to in English. One is to-infinitive, what is the other one? Write your answer in Japanese.", "a": "前置詞のto（～へ・～に）", "e": "", "w": ["接続詞のto", "助動詞のto", "関係代名詞のto"]}, {"id": 10, "q": "Write two Japanese meanings of A of B.", "a": "①BのA（所属・所有など） ②Bの中のA", "e": "", "w": ["AのB・Aの中のB", "AからB・AまでB", "AとB・AまたはB"]}, {"id": 12, "q": "When a sentence has more than one clause, what do we call the clause that can complete the sentence? Write your answer in Japanese.", "a": "主節", "e": "", "w": ["従属節", "動名詞", "前置詞句"]}, {"id": 126, "q": "The girl reading a book is my friend.【日本語訳】", "a": "本を読んでいる女の子は私の友達です。", "e": "現在分詞：girlを後ろから修飾。", "w": ["本を持っている女の子は私の妹です。", "私の友達は女の子に本を読んでいます。", "本を読んでいる男の子は私の友達です。"]}, {"id": 138, "q": "One of the pictures was taken in Japan.【日本語訳】", "a": "その写真のうちの1枚は日本で撮影されました。", "e": "A of B：Bの中のA／受動態／in Japan。", "w": ["その写真はすべて日本で撮影されました。", "その写真のうち1枚は日本で撮影されませんでした。", "その写真のうち1枚は日本へ送られました。"]}, {"id": 117, "q": "This letter is for my mother.【日本語訳】", "a": "この手紙は私の母のためのものです。", "e": "for：～のために。", "w": ["この手紙は母から届きました。", "この手紙は私の友達のためのものです。", "母はこの手紙を書きました。"]}, {"id": 6, "q": "Explain in Japanese what the third person means.", "a": "話し手（私・私たち＝一人称）と聞き手（あなた・あなたたち＝二人称）以外の人・物・事柄。", "e": "", "w": ["話し手だけを指す", "聞き手だけを指す", "話し手と聞き手だけを指す"]}, {"id": 2, "q": "To-infinitive has three Japanese meanings. Write them.", "a": "①～すること（名詞的用法） ②～するための（形容詞的用法） ③～するために・～して（副詞的用法）", "e": "", "w": ["～すること・～している・～された", "～へ・～に・～まで", "～するとき・～なので・～以来"]}, {"id": 7, "q": "Write two Japanese meanings of Since.", "a": "①～以来・～からずっと（時） ②～なので・～だから（理由）", "e": "", "w": ["～するとき・いつ～するか", "～のために・～にとって", "～まで・～の間"]}, {"id": 132, "q": "One of my friends lives in Nara.【日本語訳】", "a": "私の友達の一人は奈良に住んでいます。", "e": "A of B：Bの中のA／三人称単数 lives。", "w": ["私の友達は全員奈良に住んでいます。", "奈良に住んでいる人は私の友達ではありません。", "私は友達と奈良に住んでいます。"]}, {"id": 14, "q": "How can we tell the difference between the two kinds of to in English? Explain in Japanese.", "a": "直後を見る。 不定詞のtoは原則として動詞の原形が続き、前置詞のtoは名詞・代名詞・動名詞などが続く。", "e": "", "w": ["toの直前だけを見る", "toの後が動詞の原形なら前置詞と判断する", "文の長さで判断する"]}, {"id": 114, "q": "It is important to listen to others.【日本語訳】", "a": "他の人の話を聞くことは大切です。", "e": "形式主語It＋不定詞（真主語）。", "w": ["他の人が聞くことは難しいです。", "他の人に話すことは大切です。", "他の人の話を聞く必要はありません。"]}, {"id": 119, "q": "English is difficult for me.【日本語訳】", "a": "英語は私にとって難しいです。", "e": "for：～にとって。", "w": ["私は英語が得意です。", "英語は彼にとって難しいです。", "私にとって英語は簡単です。"]}, {"id": 123, "q": "I do not know when he will come.【日本語訳】", "a": "私は彼がいつ来るのか知りません。", "e": "when：いつSがVするか（間接疑問）。", "w": ["私は彼が来る理由を知りません。", "私は彼がいつ来るか知っています。", "私は彼が来たときのことを知りません。"]}, {"id": 111, "q": "I want to learn English.【日本語訳】", "a": "私は英語を勉強することをしたい（＝私は英語を学びたい）。", "e": "不定詞：名詞的用法（want to ...）。", "w": ["私は英語を教えたい。", "私は英語を学びました。", "私は英語を学ぶ必要はありません。"]}, {"id": 3, "q": "There are two kinds of -ing forms in English. Write each name in Japanese.", "a": "動名詞と現在分詞", "e": "", "w": ["過去分詞と現在分詞", "不定詞と動名詞", "形容詞と副詞"]}, {"id": 16, "q": "How can we tell the difference between the two kinds of -ing form in English? Explain in Japanese.", "a": "動名詞は名詞の働きをして「～すること」、前置詞の直後の場合は多くが動名詞。 現在分詞は形容詞的に名詞を修飾したり進行形（be＋-ing）を作ったりする。", "e": "", "w": ["-ingの文字数で判断する", "動名詞は形容詞、現在分詞は名詞の働きをする", "どちらも必ず進行形を作る"]}, {"id": 120, "q": "I have lived here since 2020.【日本語訳】", "a": "私は2020年からずっとここに住んでいます。", "e": "since：～以来（時）。", "w": ["私は2020年までここに住んでいました。", "私は2020年にここを出ました。", "私は2020年からここに住んでいません。"]}, {"id": 131, "q": "Many people live in Japan.【日本語訳】", "a": "多くの人々が日本に住んでいます。", "e": "in Japan：日本に。", "w": ["多くの日本人が海外に住んでいます。", "少数の人々が日本に住んでいます。", "多くの人が日本語を話します。"]}, {"id": 125, "q": "Reading books is fun.【日本語訳】", "a": "本を読むことは楽しいです。", "e": "動名詞：主語として「～すること」。", "w": ["本を書くことは楽しいです。", "本を読むことは難しいです。", "楽しい本を買いました。"]}, {"id": 136, "q": "When I went to the library, I saw a boy reading a book.【日本語訳】", "a": "私が図書館へ行ったとき、本を読んでいる少年を見ました。", "e": "whenの節／前置詞to／現在分詞の後置修飾。", "w": ["図書館へ行ったとき、本を読んでいる少女を見ました。", "図書館から帰ったとき、本を買う少年を見ました。", "少年が図書館に行ったとき、私は本を読んでいました。"]}, {"id": 128, "q": "This song is loved by many people.【日本語訳】", "a": "この歌は多くの人々に愛されています。", "e": "be動詞＋過去分詞：受動態。", "w": ["この歌は多くの人々を愛しています。", "多くの人々がこの歌を作りました。", "この歌はほとんどの人に知られていません。"]}, {"id": 129, "q": "We talked about playing tennis.【日本語訳】", "a": "私たちはテニスをすることについて話しました。", "e": "前置詞about＋動名詞。", "w": ["私たちはテニスをしながら話しました。", "私たちはテニスをするために話しました。", "私たちはテニスをした後に話しました。"]}, {"id": 133, "q": "The roof of the house is red.【日本語訳】", "a": "その家の屋根は赤いです。", "e": "A of B：BのA。", "w": ["その家の壁は赤いです。", "その赤い家には屋根がありません。", "その家の屋根は青いです。"]}, {"id": 8, "q": "Write three Japanese meanings of for.", "a": "①～のために ②～の間（期間） ③～にとって", "e": "", "w": ["～以来・～なので・～するとき", "～へ・～から・～まで", "～すること・～するための・～して"]}, {"id": 116, "q": "My brother went to Osaka to meet his friend.【日本語訳】", "a": "私の兄（弟）は友達に会うために大阪へ行きました。", "e": "前置詞to Osakaと不定詞to meetの区別。", "w": ["友達が兄（弟）に会うために大阪へ行きました。", "私の兄（弟）は大阪で友達に会いました。", "私の兄（弟）は友達と大阪を出ました。"]}, {"id": 137, "q": "She said that she wanted something to drink.【日本語 on show(s){for(const x of ['home','identity','game','win'])$(x).hidden=x!==s}function progress(n){let p=deck?n/deck.length:0;$('bar').style.width=p*100+'%';$('rabbit').style.left=`calc(${p*100}% - ${p*92-5}px)`}function home(){stopClock();show('home');progress(0);$('records').textContent='最高記録：'+Object.keys(names).map(k=>names[k]+' '+(records[k]||0)+'問').join(' ／ ')}function start(m){stopClock();mode=m;tries=0;finished=0;$('timing').hidden=m!=='all';if(m==='all'){started=performance.now();$('player').textContent='クラス番号 '+classno;tick();clock=setInterval(tick,200)}retry()}function retry(){tries++;deck=shuffle(data.filter(d=>mode==='all'||(mode==='g'?d.id<100:d.id>=100)));pos=0;show('game');render()}function render(){progress(pos);let d=deck[pos];$('count').textContent=`第 ${pos+1} / ${deck.length} 問 · 挑戦 ${tries} 回目`;$('best').textContent='最高 '+(records[mode]||0)+'問';$('q').textContent=d.q;$('opts').replaceChildren();$('feedback').hidden=true;$('next').hidden=true;for(let a of shuffle([d.a,...d.w])){let b=document.createElement('button');b.className='opt';b.textContent=a;b.onclick=()=>answer(b,a,d);$('opts').append(b)}}function answer(b,a,d){let ok=a===d.a;for(let x of $('opts').children){x.disabled=true;if(x.textContent===d.a)x.classList.add('good')}if(ok){pos++;if(mode==='all'&&pos===deck.length){finished=performance.now();stopClock();$('timer').textContent='TIME '+formatTime(finished-started)}records[mode]=Math.max(records[mode]||0,pos);save();progress(pos);$('best').textContent='最高 '+records[mode]+'問'}else{b.classList.add('bad');progress(0)}$('feedback').hidden=false;$('feedback').textContent=(ok?'○ 正解！':'× 残念！スタートに戻ります。正解：'+d.a)+(d.e?'　｜　'+d.e:'');let n=$('next');n.hidden=false;n.textContent=ok?(pos===deck.length?'ゴールへ':'次の問題へ'):'最初から再挑戦';n.onclick=()=>{if(!ok)retry();else if(pos===deck.length){finish()}else render()}}Object.assign(window,{start,identify,home});Object.defineProperty(window,"mode",{configurable:true,get:()=>mode});cleanup=stopClock;home();
